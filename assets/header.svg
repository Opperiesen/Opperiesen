<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Gabin Longoni - RHCSA and RHEL 10 learning profile</title>
  <desc id="desc">A terminal-style ASCII header showing Gabin Longoni, his role and his current RHCSA RHEL 10 focus.</desc>

  <rect width="1200" height="360" rx="16" fill="#080d16" />
  <rect x="24" y="24" width="1152" height="312" rx="10" fill="#0d1420" stroke="#263449" stroke-width="2" />

  <rect x="24" y="24" width="1152" height="38" rx="10" fill="#131d2d" />
  <rect x="24" y="52" width="1152" height="10" fill="#131d2d" />
  <circle cx="49" cy="43" r="6" fill="#ff5f56" />
  <circle cx="70" cy="43" r="6" fill="#ffbd2e" />
  <circle cx="91" cy="43" r="6" fill="#27c93f" />
  <text x="600" y="48" text-anchor="middle" fill="#94a3b8" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="14">gabin@systems: ~/profile</text>

  <g fill="#64748b" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="15">
    <text x="56" y="92">+----------------------------------------------------------------------------------------------+</text>
    <text x="56" y="112">| gabin@systems:~/profile                                                                       |</text>
    <text x="56" y="132">+----------------------------------------------------------------------------------------------+</text>
  </g>

  <g font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="17">
    <text x="650" y="166" fill="#34d399">$ whoami</text>
    <text x="650" y="190" fill="#cbd5e1">gabin.longoni</text>

    <text x="650" y="224" fill="#34d399">$ role</text>
    <text x="650" y="248" fill="#cbd5e1">systems administrator / L2 team lead</text>

    <text x="650" y="282" fill="#34d399">$ focus --current</text>
    <text x="650" y="306" fill="#fbbf24">RHCSA / RHEL 10</text>
  </g>

  <text x="56" y="330" fill="#64748b" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="15">+----------------------------------------------------------------------------------------------+</text>
</svg>
